<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رادار پول بزرگ</title><style>body{font-family:Tahoma;background:#f3f5f7;margin:0;color:#17202a}.w{max-width:720px;margin:auto;padding:14px}.c{background:#fff;border-radius:18px;padding:17px;margin:11px 0;box-shadow:0 2px 12px #0001}.h{background:#17202a;color:#fff}.row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eee;font-size:13px}.ok{color:#087a35}.bad{color:#a21d1d}</style><div class=w><div class="c h"><h1>🧭 رادار پول بزرگ</h1><div>نسخه ۲ — اتصال رایگان</div></div><div class=c><b id=s>⏳ در انتظار اتصال...</b><p>Worker را در app.js تنظیم کن.</p></div><div class=c><h3>💰 بیشترین ارزش معاملات</h3><div id=l>—</div></div></div><script>const WORKER='PASTE_WORKER_URL';(async()=>{try{let r=await fetch(WORKER,{cache:'no-store'}),d=await r.json();if(!d.ok)throw 0;document.querySelector('#s').innerHTML='<span class=ok>🟢 اتصال برقرار</span> | '+d.count.toLocaleString('fa-IR')+' نماد';let a=(d.items||[]).filter(x=>x.value>0).sort((a,b)=>b.value-a.value).slice(0,20);document.querySelector('#l').innerHTML=a.map((x,i)=>`<div class=row><b>${i+1}. ${x.symbol||'—'}</b><span>${Math.round(x.value).toLocaleString('fa-IR')}</span></div>`).join('')}catch(e){document.querySelector('#s').innerHTML='<span class=bad>🔴 هنوز متصل نیست</span>'}})()</script></html>
