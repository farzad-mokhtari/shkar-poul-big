name: market-snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - run: python collector/collect.py
      - run: git config user.name market-bot && git config user.email actions@users.noreply.github.com && git add data/market.json && git diff --cached --quiet || git commit -m 'market snapshot'
      - run: git push
